# Every push to main replaces the "latest-main" pre-release. Pushing a tag such as v1.0.0 makes a
# permanent release. Pull requests only build and test.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to main replaces an older build, but a tag's release always finishes.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            smoke_runner: ""
            binary: dist/Mouthpiece.app/Contents/MacOS/mouthpiece
          - name: Linux (x86_64)
            # The oldest supported Ubuntu, because a binary runs on its build system's glibc or newer.
            os: ubuntu-22.04
            smoke_runner: xvfb-run -a
            binary: dist/mouthpiece/mouthpiece
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config \
            autoconf automake libtool libasound2-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri libxkbcommon-x11-0 libx11-xcb1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Choose the release label
        id: label
        run: echo "value=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: scripts/package.sh "${{ steps.label.outputs.value }}"

      # Reported on the run, but it doesn't hold back the release: a virtual display is a harder
      # place to start a GPU app than a real desktop.
      - name: Launch the packaged app
        continue-on-error: true
        run: ${{ matrix.smoke_runner }} scripts/smoke.sh "${{ matrix.binary }}" smoke

      - name: Keep the screenshot and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ runner.os }}
          path: |
            dist/Mouthpiece-*.zip
            dist/Mouthpiece-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Publish a tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" packages/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Replace the rolling pre-release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          gh release create latest-main packages/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest build of main" \
            --notes "Built automatically from $GITHUB_SHA."
