[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mp-model = { path = "crates/mp-model" }
mp-dsp = { path = "crates/mp-dsp" }
mp-engine = { path = "crates/mp-engine" }
mp-analysis = { path = "crates/mp-analysis" }
mp-export = { path = "crates/mp-export" }
mp-vfx = { path = "crates/mp-vfx" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rustfft = "6.4"
crossbeam-channel = "0.5"
parking_lot = "0.13"
rtrb = "0.3"

# Audio must stay real time while developing, so DSP dependencies are always optimised.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
