[package]
name = "mp-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mouthpiece"
path = "src/main.rs"

[dependencies]
mp-model.workspace = true
mp-dsp.workspace = true
mp-engine.workspace = true
mp-analysis.workspace = true
mp-export.workspace = true
mp-vfx.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
eframe = "0.37"
rfd = "0.16"
png = "0.18"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
